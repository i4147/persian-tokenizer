[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "persian-tokenizer"
version = "1.0.0"
description = "Persian text tokenizer: normalization, ZWNJ fixing, punctuation/digit conversion, stop words, stemming"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["persian", "farsi", "tokenizer", "nlp", "normalization", "stemming"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]

[[project.authors]]
name = "Isaac Onagh"
email = "yesnacoc@gmail.com"
[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.0"]

[project.urls]
Homepage = "https://github.com/i4147/persian-tokenizer"
Repository = "https://github.com/i4147/persian-tokenizer"
Issues = "https://github.com/i4147/persian-tokenizer/issues"
[tool.setuptools]
packages = ["persian_tokenizer"]
